url: https://bart-turczynski.gitlab.io/pslr/
destination: site

template:
  bootstrap: 5

navbar:
  structure:
    left: [reference, articles, news, acknowledgments]
    right: [search, gitlab]
  components:
    acknowledgments:
      text: Acknowledgments
      href: https://gitlab.com/bart-turczynski/pslr/-/blob/main/ACKNOWLEDGMENTS.md
    gitlab:
      icon: fab fa-gitlab fa-lg
      href: https://gitlab.com/bart-turczynski/pslr
      aria-label: GitLab

authors:
  "Bart Turczynski":
    href: https://turczynski.pl

footer:
  structure:
    left: developed_by
    right: [built_with, related]
  components:
    related: >
      Related:
      <a href="https://CRAN.R-project.org/package=punycoder">punycoder</a> ·
      <a href="https://CRAN.R-project.org/package=rurl">rurl</a>

reference:
  - title: Querying
    desc: >
      Extract public suffixes and registrable domains from hostname strings.
    contents:
      - public_suffix
      - registrable_domain
      - is_public_suffix
      - suffix_extract
      - public_suffix_rule

  - title: Provenance
    desc: >
      Identity of the list that answered: which snapshot, and how hosts were
      normalized. Offline.
    contents:
      - psl_version
      - psl_rules

  - title: Freshness
    desc: >
      What is known about how current a snapshot is, and how to find out more.
      Everything here is offline except `psl_refresh()`, the package's only
      network path.
    contents:
      - psl_status
      - psl_refresh
      - psl_reminder

  - title: Snapshots and storage
    desc: >
      Choose which snapshot backs the session, see what is stored locally, and
      reclaim snapshots nothing references any more. Offline.
    contents:
      - psl_use
      - psl_snapshots
      - psl_diff
      - psl_cache_prune

  - title: Engines
    desc: >
      Build a self-contained PSL engine to query a specific snapshot without
      switching the session-global list.
    contents:
      - psl_engine
