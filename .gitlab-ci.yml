# GitLab CI for pslr: fleet-ci's template, pinned by commit SHA (seor
# ADR 0012, fleet-ci README "The CI template"). The template owns the event
# table, the jobs and the images; this file sets only the package's switches
# and settings, and adds pslr's x-* jobs. A push to main or a branch, and a
# merge request, create no pipeline: the merge gate is the local one
# (.fleet-ci/gate, run by the .fleet-ci/pre-push hook; settings in
# .fleet-ci.yml). T2 runs on the deep-check schedule (SCHEDULE_KIND=deep-check,
# schedule 4472812), T3 on a RELEASE=1 web pipeline and a v* tag. The
# dependency-audit schedule (4467477) gets no pipeline: osv-audit and
# security-audit run in T2. docs/git-workflow.md says what moved where.
#
# Bump the pin by changing `ref:` and re-running fleet-ci's bin/vendor at the
# same SHA, in one merge request: .fleet-ci/VERSION must equal `ref:`.
include:
  - project: bart-turczynski/fleet-ci
    ref: 5665e94723729437a1bf272e5d1587481c075187
    file: templates/r-package.yml

variables:
  # punycoder's configure builds its libidn2 backend when pkg-config finds
  # libidn2, as on CRAN's Debian flavors, and pslr hands every host to
  # punycoder, whose two builds can decode differently (rurl's
  # RURL-woljcpfu). The local gate runs on the image with libidn2 and
  # rebuilds punycoder there (.fleet-ci.yml), and its `variant` must equal
  # this, so the release legs (t2-check-release, t2-ascran, coverage) run on
  # fleet-r-idn2 too. They install punycoder's Posit Package Manager binary,
  # which is built without libidn2 (SEOR-vpihrxww), so they check the
  # fallback build, as the oldrel, devel, floor, sanitizer and locale legs
  # do; x-check-idn2 below rebuilds punycoder with libidn2 and asserts it.
  FLEET_RELEASE_VARIANT: "fleet-r-idn2"
  # t2-ascran runs CRAN incoming feasibility with its remote half off: ADR
  # 0004 grandfathered pslr's remote suppression pending its own ticket, and
  # ADR 0012 carries it forward as this setting.
  FLEET_INCOMING_REMOTE: "false"
  # The declared floor, `Depends: R (>= 4.1.0)`: 4.1 is the oldest minor with
  # an arm64 rocker/r-ver image, which the runner needs. The former floor
  # leg ran rocker/r-ver:4.1.3 against current packages, because punycoder
  # (>= 1.3.0) is newer than any snapshot inside R 4.1's support window, so
  # the snapshot is fleet-ci's own p3m date, as in rurl. Its Ubuntu 20.04
  # binary path spares source builds on rocker/r-ver:4.1.3. Unproven until
  # the first T2 run: docs/git-workflow.md, "Gaps accepted".
  FLEET_FLOOR_R: "4.1.3"
  FLEET_FLOOR_SNAPSHOT: "https://packagemanager.posit.co/cran/__linux__/focal/2026-10-28"

# punycoder built with libidn2, at the release R version: the cell CRAN's
# Debian flavors build (SEOR-hxxxkmws). It runs on the global
# FLEET_RELEASE_VARIANT, fleet-r-idn2, and scripts/punycoder-backend.R
# rebuilds punycoder from source there and fails the job unless the build
# reports the libidn2 backend, so this job is never silently the fallback
# cell. The local gate does the same before every push; this is the cell's
# run in CI. Copied from rurl's x-check-idn2.
x-check-idn2:
  extends: .t2-job
  image: $FLEET_RELEASE_IMAGE
  variables:
    NOT_CRAN: "true"
    _R_CHECK_CRAN_INCOMING_: "false"
    _R_CHECK_CRAN_INCOMING_REMOTE_: "false"
    FLEET_CHECK_ARGS: "--no-manual"
    FLEET_BUILD_ARGS: "--no-manual --compact-vignettes=gs+qpdf"
  before_script:
    - !reference [.fleet-r, before_script]
  script:
    - fleet-tools Rscript scripts/punycoder-backend.R "$FLEET_RUN_LIB" libidn2
    - !reference [.fleet-scripts, check]
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - check/

# ASAN + UBSAN over the C++ matcher with the image's own gcc, natively on the
# arm64 runner: the former `sanitizers` job, kept beside the template's
# t2-sanitizers, which runs R-hub's clang-asan container (amd64 only, so
# emulated here). -fno-sanitize-recover=all makes UBSAN abort rather than
# print and continue. `--no-test-load` because the post-install load test
# dlopens the instrumented .so from an R with no sanitizer runtime, which
# ASAN refuses; the real load happens under LD_PRELOAD. detect_leaks=0
# because R itself is not instrumented, so leak reports would be R's
# allocations. The instrumented install goes to its own library, never the
# run library. The valgrind leg stays local (`tools/verify.sh sanitize`).
x-sanitizers-gcc:
  extends: .t2-job
  image: $FLEET_RELEASE_IMAGE
  variables:
    NOT_CRAN: "true"
  before_script:
    - !reference [.fleet-r, before_script]
  script:
    - |
      set -eu
      flags="-g -O1 -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
      mkdir -p ~/.R /tmp/asan-lib
      {
        echo "CFLAGS = $flags"
        echo "CXXFLAGS = $flags"
        echo "LDFLAGS = -fsanitize=address,undefined"
      } > ~/.R/Makevars
      rm -f src/*.o src/*.so
      R_LIBS="$FLEET_RUN_LIB" R CMD INSTALL --preclean --no-staged-install --no-test-load -l /tmp/asan-lib .
      LD_PRELOAD="$(gcc -print-file-name=libasan.so)" \
      ASAN_OPTIONS=detect_leaks=0 \
      UBSAN_OPTIONS=print_stacktrace=1 \
      R_LIBS="/tmp/asan-lib:$FLEET_RUN_LIB" \
        Rscript -e 'testthat::test_local(reporter = "summary", stop_on_failure = TRUE)'

# Upstream PSL watcher, the job with a data consequence: discovery only. It
# opens a merge request for review, never commits to main, never merges, and
# never touches NEWS.md or the package version. Regeneration is not
# reimplemented: it shells out to data-raw/update_psl.R, the same script a
# maintainer runs by hand, so the normalization profile cannot drift between
# the two paths. It ran in the former CRAN_PREP pipeline, advisory; it now
# runs in every T3 pipeline (a RELEASE=1 web run and a v* tag), still
# allowed to fail: PSL_BOT_TOKEN, a project access token with `api` and
# `write_repository` scopes, is not set, and the job says so in red.
#
# Reading upstream uses the public GitHub API: an unauthenticated read of
# publicsuffix/list.
#
# The token check runs first, so a missing token fails the job before the
# dependency install. The job then works on the default branch's tip, not the
# pipeline's commit: on a v* tag that commit is the tag, and the merge request
# targets the default branch, so a branch cut from the tag would carry the
# wrong base. The dependencies are installed for that tip, plus what
# cpp11::cpp_register() needs and pslr does not declare (decor), because
# update_psl.R's pkgload::load_all() compiles src/ and runs it.
x-psl-upstream-check:
  extends: .t3-job
  image: $FLEET_RELEASE_IMAGE
  allow_failure: true
  timeout: 1h
  variables:
    GIT_STRATEGY: clone
  before_script:
    - |
      set -eu
      if [ -z "${PSL_BOT_TOKEN:-}" ]; then
        echo "PSL_BOT_TOKEN is not set. This job can detect upstream movement but cannot push a branch or open a merge request, which is the only useful thing it does. Create a project access token with 'api' and 'write_repository' scopes."
        exit 1
      fi
    - git fetch --quiet origin "+refs/heads/${CI_DEFAULT_BRANCH}:refs/remotes/origin/${CI_DEFAULT_BRANCH}"
    - git checkout --quiet --detach "origin/${CI_DEFAULT_BRANCH}"
    - !reference [.fleet-r, before_script]
    - fleet-tools Rscript scripts/cpp-register-needs.R "$FLEET_RUN_LIB"
  script:
    - |
      set -eu
      pinned="$(sed -nE 's/^default_commit <- "([0-9a-f]{40})".*/\1/p' data-raw/update_psl.R)"
      if [ -z "$pinned" ]; then
        echo "ERROR: could not read 'default_commit' from data-raw/update_psl.R. The pin format changed; this job needs updating."
        exit 1
      fi
      # Latest commit that touched the list file itself, not the repo HEAD:
      # upstream carries tooling and test commits that leave the list alone.
      upstream="$(curl -sSf 'https://api.github.com/repos/publicsuffix/list/commits?path=public_suffix_list.dat&per_page=1' | jq -r '.[0].sha')"
      if ! printf '%s' "$upstream" | grep -qxE '[0-9a-f]{40}'; then
        echo "ERROR: upstream lookup did not return a 40-character SHA (got '$upstream')."
        exit 1
      fi
      echo "pinned in tree : $pinned"
      echo "upstream latest: $upstream"
      branch="chore/psl-snapshot-$(printf '%s' "$upstream" | cut -c1-12)"
      if [ "$pinned" = "$upstream" ]; then
        echo "Bundled snapshot is current. No merge request needed."
        exit 0
      fi
      if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
        echo "Branch '$branch' already exists; a merge request for this upstream commit was opened already."
        exit 0
      fi
      echo "Upstream has moved. Regenerating."

      Rscript data-raw/psl_snapshot_meta.R > before.env
      # pkgload and jsonlite come from the image's tooling library, pslr's
      # own dependencies from the run library.
      R_LIBS="$FLEET_RUN_LIB" fleet-tools Rscript data-raw/update_psl.R "$upstream"
      sed -i -E "s/^default_commit <- \"[0-9a-f]{40}\"/default_commit <- \"${upstream}\"/" data-raw/update_psl.R
      # Leaving the pin behind would ship artifacts that disagree with the
      # script that claims to generate them, so treat a failed edit as fatal.
      if ! grep -qxF "default_commit <- \"${upstream}\"" data-raw/update_psl.R; then
        echo "ERROR: failed to advance 'default_commit' to ${upstream}."
        exit 1
      fi
      Rscript data-raw/psl_snapshot_meta.R > after.env

      # Fold the two KEY=VALUE snapshots into old_* / new_* shell variables.
      # shellcheck disable=SC2163
      while IFS='=' read -r key value; do
        [ -n "$key" ] || continue
        eval "old_${key}=\$value"
      done < before.env
      while IFS='=' read -r key value; do
        [ -n "$key" ] || continue
        eval "new_${key}=\$value"
      done < after.env

      git config user.name "pslr CI"
      git config user.email "bartek@turczynski.pl"
      git checkout -b "$branch"
      git add \
        inst/extdata/public_suffix_list.dat \
        inst/extdata/PSL-LICENSE \
        inst/NOTICE \
        R/sysdata.rda \
        tests/testthat/fixtures/psl-vectors.txt \
        data-raw/update_psl.R
      if git diff --cached --quiet; then
        echo "WARNING: upstream SHA moved but regeneration produced no file changes. Nothing to review."
        exit 0
      fi
      git commit -m "chore: refresh bundled PSL snapshot to ${upstream}

      Regenerated by the x-psl-upstream-check job in .gitlab-ci.yml via
      data-raw/update_psl.R. Review the upstream diff before merging;
      NEWS.md and the package version are deliberately untouched."
      git push "https://oauth2:${PSL_BOT_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:refs/heads/${branch}"

      cat > mr-body.md <<EOF
      Automated **discovery** merge request: upstream \`publicsuffix/list\` has a newer
      commit to \`public_suffix_list.dat\` than the snapshot pinned in this repo.
      Regenerated by the \`x-psl-upstream-check\` job in \`.gitlab-ci.yml\`, which shells
      out to \`data-raw/update_psl.R\` -- the same script a maintainer runs by hand.

      This MR is for review. Nothing was auto-merged, and \`NEWS.md\` and the package
      version are deliberately untouched: a bundled-data change alters query results
      and is release-shaped, so per \`design/release-deltas.md\` those stay maintainer calls.

      ## Snapshot

      | | Before | After |
      |---|---|---|
      | Upstream commit | \`${pinned}\` | \`${upstream}\` |
      | \`list_date\` | ${old_list_date} | ${new_list_date} |
      | \`checksum\` | \`${old_checksum}\` | \`${new_checksum}\` |
      | Size (bytes) | ${old_size} | ${new_size} |
      | Rules | ${old_rules} | ${new_rules} |
      | ICANN / private | ${old_icann} / ${old_private} | ${new_icann} / ${new_private} |
      | Normalization | ${old_profile} / Unicode ${old_unicode_version} | ${new_profile} / Unicode ${new_unicode_version} |
      | Normalizer | ${old_normalizer} ${old_normalizer_version} | ${new_normalizer} ${new_normalizer_version} |

      Upstream diff: <https://github.com/publicsuffix/list/compare/${pinned}...${upstream}>

      ## Before merging

      1. **Review the upstream diff** -- \`git diff inst/extdata/public_suffix_list.dat\`.
         A rule that moves the registrable-domain boundary is a behavior change.
      2. **Check \`normalizer_version\` above.** It records whatever the runner
         resolved, and should equal the \`punycoder\` floor in \`DESCRIPTION\`'s
         \`Imports:\`. A different version means the index must be regenerated
         before it ships to CRAN (PSLR-fjkaqckg).
      3. **Add the \`NEWS.md\` entry** recording the new \`list_date\`, \`commit\`, and
         \`checksum\`, and decide the version bump.
      4. Check the branch out and run the local gate on it (\`.fleet-ci/gate full\`):
         no pipeline runs for a merge request, and the CC0 conformance vectors in
         \`tests/testthat/fixtures/psl-vectors.txt\` are re-pinned in lockstep and
         must stay green.

      See \`design/release-deltas.md\` > Bundled PSL snapshot.
      EOF

      jq -n \
        --arg source "$branch" \
        --arg target "$CI_DEFAULT_BRANCH" \
        --arg title "chore: refresh bundled PSL snapshot to $(printf '%s' "$upstream" | cut -c1-12)" \
        --rawfile description mr-body.md \
        '{source_branch: $source, target_branch: $target, title: $title, description: $description, remove_source_branch: true}' \
        > mr.json

      curl -sSf -X POST \
        --header "PRIVATE-TOKEN: ${PSL_BOT_TOKEN}" \
        --header "Content-Type: application/json" \
        --data @mr.json \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests" \
        | jq -r '"Opened " + .web_url'
