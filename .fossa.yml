# .fossa.yml — FOSSA CLI configuration for pslr
# Schema: https://github.com/fossas/fossa-cli/blob/master/docs/references/files/fossa-yml.md
#
# SCOPE OF THIS FILE
#   .fossa.yml controls WHAT gets scanned (project identity + path/target
#   filtering). It does NOT — and cannot — encode license allow/deny or
#   per-issue "ignore" rules. Those live in a FOSSA *Policy*, which is a PAID
#   feature not available on this account. So there is intentionally no
#   `project.policy` binding here. The flagged findings are all benign for an
#   MIT project (see .fossa/POLICY.md for the per-dependency rationale); the
#   chosen disposition is to keep FOSSA INFORMATIONAL. (Verified on the sibling
#   `rurl` repo: main has no branch protection/rulesets and FOSSA posts no
#   status check, so it already gates nothing — the red is internal to the
#   FOSSA dashboard only.)
#   The path excludes below still apply when the FOSSA CLI is run.
#
# WHY project.id STILL SAYS github.com
#   It is a FOSSA-internal project locator, not a URL FOSSA fetches. It is the
#   primary key of the existing project in the FOSSA dashboard and the string
#   embedded in the two README badges, which resolve today. Repointing it at
#   gitlab.com would not move the project — it would register a second, empty
#   one, breaking both badges and abandoning the scan history. The canonical
#   home of pslr is GitLab (PSLR-thcaqtnw); this line is a legacy identifier and
#   deliberately not part of that move.
version: 3

project:
  id: git+github.com/bart-turczynski/pslr
  name: pslr

paths:
  exclude:
    # Rendered pkgdown site: bundles third-party web assets (Bootstrap, jQuery,
    # Font Awesome's SIL-OFL font + CC-BY icons) that raise license findings
    # unrelated to the package. Generated output, never distributed as source.
    - docs
    # R CMD check scratch output — build artifacts, never distributed.
    - '**/*.Rcheck'
    # Test fixtures: upstream PSL test vectors carrying a third-party CC0
    # (public-domain) header that raises a finding unrelated to the package.
    # Test-only data, not part of the runtime/distributed code.
    - tests/testthat/fixtures
