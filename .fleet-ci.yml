# The fleet-ci local gate's settings: T0 (docs) and T1 (full) before every
# push, run by .fleet-ci/gate in the fleet image (fleet-ci README, "The
# .fleet-ci.yml file"; seor ADR 0012). Read from the pushed commit. The
# t2-locale and pages CI jobs read it too.
version: 1

# The image the gate runs in. fleet-r-idn2 carries libidn2, so punycoder can
# build its libidn2 backend, as on CRAN's Debian flavors. It must be
# .gitlab-ci.yml's FLEET_RELEASE_VARIANT. Posit Package Manager's punycoder
# binary is built without libidn2 (SEOR-vpihrxww), so the first cheap gate
# rebuilds it; T2 runs the libidn2 cell again (x-check-idn2), and the build
# without libidn2 is T2's other legs, which install that binary.
variant: fleet-r-idn2

# No docs_exclude: no full-tier gate reads a docs-allowlisted path. The docs
# tier's own check_pkgdown() reads _pkgdown.yml, and the pre-push hook that
# reads _pkgdown.yml and design/** (scripts/check-bugreports.py) runs on
# every push whatever the tier. docs/ here is hand-written source (the PRD,
# the decision log), which no gate reads either.

# T0, and the start of T1. Genuine terms go in inst/WORDLIST (SEOR-mtbzfroz).
docs_gates:
  - Rscript -e 'bad <- spelling::spell_check_package(); if (nrow(bad)) { print(bad); quit(status = 1) }'

# T1, on the host, in a worktree of the pushed commit: the NEWS heading
# against the version, and every v* tag's heading still there, which needs
# the tags the export lacks.
host_gates:
  - sh scripts/check-news-version.sh

# T1, in the container after the dependency install, each run whatever the
# others report. First, punycoder rebuilt from source in the run library and
# asserted to carry libidn2 (SEOR-hxxxkmws): the dependency install takes
# Posit Package Manager's binary, built without it, and R CMD check below
# runs against the rebuilt one. Then man/, NAMESPACE and DESCRIPTION against
# a fresh roxygen2 run (SEOR-nwfmerhu), lintr, README.md against a fresh
# knit, and every declared URL (the gate's R CMD check runs with remote
# incoming, and so its URL check, off).
cheap_gates:
  - Rscript scripts/punycoder-backend.R "$R_LIBS" libidn2
  - Rscript scripts/check-docs-drift.R .
  - Rscript -e 'lints <- lintr::lint_package(); if (length(lints)) { print(lints); quit(status = 1) }'
  - sh scripts/check-readme-drift.sh
  - Rscript tools/check-urls.R

# The case-folding legs of test-parser.R (PSLR-yomylzid) run where R can
# switch LC_CTYPE to each locale in
# tests/testthat/fixtures/case-folding-locales.txt, the one list of them,
# and skip elsewhere. The gate runs as the invoking user and reads compiled
# locales from its own LOCPATH only (fleet-ci README, "A known local/CI
# difference: locales"), so every one is listed here; t2-locale builds the
# same list.
locales:
  - tr_TR.UTF-8
  - az_AZ.UTF-8

# The positive locale assertion (PSLR-mgqnsbjz): every locale folds I to the
# dotless i, and every leg named in case-folding-locales.txt ran and passed
# against the pslr the leg's check installed. Run after each locale leg's
# check (the default leg, LC_ALL=C), here and in t2-locale.
locale_assertions:
  - Rscript scripts/check-locale-legs.R "$FLEET_RCHECK_DIR"

# The gate runs R CMD check with NOT_CRAN=true, so skip_on_cran() no longer
# keeps these out of it. T2 runs both, as osv-audit and security-audit.
exclude_tests:
  - path: tests/testthat/test-osv.R
    why: queries osv.dev over the network; the osv-audit job runs it in T2
  - path: tests/testthat/test-security.R
    why: queries Sonatype OSS Index with credentials the gate does not have; the security-audit job runs it in T2

# Every skip R CMD check's test run may report; any other fails the gate.
allowed_skips: []

# The top-level .md files the pkgdown site publishes; every other one (the
# agent files among them) is moved out before build_site() (SEOR-wqxhftpv).
# The same keep-list the former `pages` job applied: every page live when it
# landed (ACKNOWLEDGMENTS, CODE_OF_CONDUCT, CONTRIBUTING, LICENSE, SECURITY)
# and ARCHITECTURE.md, the fleet standard's root map. cran-comments.md is on
# pkgdown's own skip list.
pages_keep:
  - README.md
  - NEWS.md
  - LICENSE.md
  - CONTRIBUTING.md
  - SECURITY.md
  - CODE_OF_CONDUCT.md
  - ACKNOWLEDGMENTS.md
  - ARCHITECTURE.md
  - cran-comments.md
