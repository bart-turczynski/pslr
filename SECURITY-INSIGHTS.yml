header:
  schema-version: 2.2.0
  last-updated: '2026-10-03'
  last-reviewed: '2026-10-03'
  url: https://gitlab.com/bart-turczynski/pslr/-/raw/main/SECURITY-INSIGHTS.yml
  comment: |
    OpenSSF Security Insights self-report. Maintained alongside SECURITY.md
    (human-readable policy) and .bestpractices.json (OpenSSF Best Practices
    badge self-assessment). Refresh both header dates whenever anything below
    is re-measured, not only when it changes -- a self-report that claims a
    review date it never had is the failure mode this file exists to avoid.

project:
  name: pslr
  homepage: https://bart-turczynski.gitlab.io/pslr/
  administrators:
    - name: Bart Turczynski
      email: bartek@turczynski.pl
      primary: true
  documentation:
    quickstart-guide: https://bart-turczynski.gitlab.io/pslr/
    detailed-guide: https://bart-turczynski.gitlab.io/pslr/reference/index.html
    release-process: https://gitlab.com/bart-turczynski/pslr/-/blob/main/CONTRIBUTING.md
  repositories:
    - name: pslr
      url: https://gitlab.com/bart-turczynski/pslr
      comment: |
        Sole repository for the pslr package. Host canonicalization (IDNA) is
        delegated to the sibling punycoder package.
  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    contact:
      name: Bart Turczynski
      email: bartek@turczynski.pl
      primary: true
    policy: https://gitlab.com/bart-turczynski/pslr/-/blob/main/SECURITY.md
    comment: |
      Please do not report vulnerabilities through public GitLab issues. Email
      the maintainer, or open a **confidential** issue instead (tick "This
      issue is confidential" when creating it). GitLab Free has no equivalent
      to GitHub private vulnerability reporting; a confidential issue is the
      closest supported channel.

repository:
  url: https://gitlab.com/bart-turczynski/pslr
  status: active
  bug-fixes-only: false
  accepts-change-request: true
  accepts-automated-change-request: false
  no-third-party-packages: false
  core-team:
    - name: Bart Turczynski
      email: bartek@turczynski.pl
      primary: true
  documentation:
    contributing-guide: https://gitlab.com/bart-turczynski/pslr/-/blob/main/CONTRIBUTING.md
    security-policy: https://gitlab.com/bart-turczynski/pslr/-/blob/main/SECURITY.md
  license:
    url: https://gitlab.com/bart-turczynski/pslr/-/blob/main/LICENSE
    expression: MIT
  release:
    changelog: https://gitlab.com/bart-turczynski/pslr/-/blob/main/NEWS.md
    automated-pipeline: false
    distribution-points:
      - uri: https://CRAN.R-project.org/package=pslr
        comment: Canonical release channel (CRAN).
      - uri: https://bart-turczynski.r-universe.dev/pslr
        comment: Development builds from the default branch.
  security:
    tools:
      - name: rosv (OSV)
        type: SCA
        rulesets:
          - default
        integration:
          adhoc: true
          ci: true
          release: false
        results: {}
        comment: |
          The osv-audit job in .gitlab-ci.yml audits the runtime dependency
          closure against the OSV database (osv.dev). No account or secrets
          required. It runs on the weekly pipeline schedule that sets
          SCHEDULE_KIND=dependency-audit, and in a CRAN_PREP pipeline.
      - name: oysteR (Sonatype OSS Index)
        type: SCA
        rulesets:
          - default
        integration:
          adhoc: true
          ci: true
          release: false
        results: {}
        comment: |
          The security-audit job in .gitlab-ci.yml audits declared dependencies
          against the Sonatype OSS Index, on the same schedule as osv-audit. It
          needs the OSSINDEX_USER (the literal `x`) and OSSINDEX_TOKEN CI/CD
          variables, and fails rather than skips when they are missing.
      - name: ASAN/UBSAN
        type: other
        rulesets:
          - default
        integration:
          adhoc: true
          ci: true
          release: false
        results: {}
        comment: |
          The sanitizers job in .gitlab-ci.yml runs the test suite over the
          C++ matcher built with -fsanitize=address,undefined, on the weekly
          pipeline schedule that sets SCHEDULE_KIND=deep-check.
          `tools/verify.sh sanitize` runs the same leg locally, plus valgrind.
