# Full cross-platform R CMD check matrix: macOS, Windows, and Ubuntu on R
# devel / release / oldrel-1, all under --as-cran. This is the CRAN-grade
# coverage, and it runs at every point where a code change could break a
# platform we do not develop on:
#
#   - release tags matching 'v*'      (CRAN-submission compliance check)
#   - merges to main                  (unconditional -- nothing lands unproven,
#                                      so the close of an epic is always fully
#                                      checked whatever its final commit touched)
#   - any PR that is not documentation-only (see `paths-ignore` below)
#   - a weekly schedule               (catches upstream toolchain/R-devel drift
#                                      on an otherwise quiet repo)
#   - on demand via workflow_dispatch
#
# This repo is PUBLIC, so standard GitHub-hosted runners are free and unlimited
# on every OS -- the macOS 10x / Windows 2x minute multipliers only bill against
# a private repo's quota. Coverage here is therefore NOT rationed by cost. The
# only reason documentation-only PRs skip the matrix is turnaround: the fast
# gate in verify.yml returns in about five minutes, the matrix in fifteen to
# twenty, and prose cannot break a platform. Anything that R CMD check actually
# executes -- R sources, tests, compiled code, vignettes, Rd examples, build
# metadata -- gets all five legs.
#
# The local pre-push hook runs the full `R CMD check --as-cran` on the
# developer's own platform regardless.
name: Full platform check

on:
  # CRAN-submission prep: release tags matching 'v*'.
  push:
    branches: [main]
    tags: ['v*']
  # Every PR except documentation-only ones. Inverted deliberately: a `paths`
  # allowlist has to enumerate every code path and silently loses coverage when
  # one is forgotten -- the previous list omitted `R/**` and `tests/**`, so
  # ordinary R changes only ever saw the single Ubuntu leg. An ignore list fails
  # safe: anything unlisted runs the matrix.
  #
  # `man/**` is deliberately NOT ignored. Rd files are documentation, but their
  # \examples{} blocks are executed by R CMD check, so they are code for this
  # purpose.
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'pkgdown/**'
      - '_pkgdown.yml'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/pkgdown.yaml'
  # Weekly drift check: upstream R-devel and toolchain changes can break a repo
  # that has not changed at all.
  schedule:
    - cron: '17 5 * * 1'
  # On demand.
  workflow_dispatch:

permissions: read-all

concurrency:
  group: full-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          # The strict CRAN-grade pass: --as-cran across every platform. This is
          # what CRAN itself runs, so it is the gate before a release.
          args: 'c("--no-manual", "--as-cran")'
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
