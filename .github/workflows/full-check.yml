# Full cross-platform R CMD check matrix: macOS, Windows, and Ubuntu on R
# devel / release / oldrel-1, all under --as-cran. This is the CRAN-grade
# coverage that is too costly (macOS = 10x, Windows = 2x Actions minute
# multipliers) to run on every commit, so it is scoped to the points where
# cross-platform breakage actually matters:
#
#   - release tags matching 'v*'      (CRAN-submission compliance check)
#   - merges to main                  (nothing platform-specific lands unproven)
#   - PRs touching compiled or build inputs (see `paths` below) -- these are the
#     changes that can break one platform while passing the Ubuntu gate
#   - a weekly schedule               (catches upstream toolchain/R-devel drift
#                                      on an otherwise quiet repo)
#   - on demand via workflow_dispatch
#
# Ordinary R-only, docs, and test PRs still get fast feedback from verify.yml
# (lint + one Ubuntu check) and do NOT pay the 5-platform tax. The local
# pre-push hook runs the full `R CMD check --as-cran` on the developer's own
# platform regardless.
name: Full platform check

on:
  # CRAN-submission prep: release tags matching 'v*'.
  push:
    branches: [main]
    tags: ['v*']
  # PRs that touch compiled sources, build metadata, or the bundled index --
  # the changes most likely to behave differently per platform or per R version.
  # `Remotes:` pins in DESCRIPTION also land here, since a GitHub-sourced
  # dependency is built from source on macOS/Windows rather than installed as a
  # binary.
  pull_request:
    paths:
      - 'src/**'
      - 'DESCRIPTION'
      - 'R/sysdata.rda'
      - 'configure*'
      - 'cleanup*'
      - '.github/workflows/full-check.yml'
  # Weekly drift check: upstream R-devel and toolchain changes can break a repo
  # that has not changed at all.
  schedule:
    - cron: '17 5 * * 1'
  # On demand.
  workflow_dispatch:

permissions: read-all

concurrency:
  group: full-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          # The strict CRAN-grade pass: --as-cran across every platform. This is
          # what CRAN itself runs, so it is the gate before a release.
          args: 'c("--no-manual", "--as-cran")'
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
