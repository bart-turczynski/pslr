# Discovery-only watch on the upstream Public Suffix List.
#
# CONTRIBUTING.md's release process deliberately keeps bundled-snapshot
# regeneration a manual, maintainer-gated step: CRAN policy forbids network
# access at build/check time, and reproducibility depends on a human reviewing
# the upstream diff. That decision stands. What was missing was *discovery* --
# nothing told us when upstream had actually moved, so staleness surfaced only
# if someone remembered to look before a release.
#
# This workflow closes that gap and nothing else. It opens a PR for review; it
# never commits to main, never merges, and never touches NEWS.md or the package
# version, which stay maintainer decisions at merge/release time. It is a fully
# separate, optional workflow -- verify.yml and full-check.yml must stay
# network-free, so no part of this runs inside them.
#
# Regeneration itself is NOT reimplemented here: this shells out to
# data-raw/update_psl.R, the same script a maintainer runs by hand, so the
# normalization profile can never drift between the two paths.
#
# Review note for whoever picks up the PR this opens: the regenerated index
# records whichever normalizer the runner resolved (`normalizer_version` in the
# PR body). While the temporary `punycoder` Remotes pin is in place that will be
# a development version, which must not ship to CRAN -- see PSLR-fjkaqckg.
name: Upstream PSL check

on:
  schedule:
    # Mondays 06:23 UTC, offset from full-check.yml's 05:17 so the two do not
    # contend for a runner.
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions: read-all

concurrency:
  group: psl-upstream-check
  cancel-in-progress: false

jobs:
  upstream-check:
    runs-on: ubuntu-latest
    name: Check upstream PSL for a newer commit
    permissions:
      contents: write
      pull-requests: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Compare the pinned commit against upstream
        id: compare
        run: |
          set -euo pipefail
          pinned="$(sed -nE 's/^default_commit <- "([0-9a-f]{40})".*/\1/p' data-raw/update_psl.R)"
          if [ -z "$pinned" ]; then
            echo "::error file=data-raw/update_psl.R::Could not read 'default_commit' from data-raw/update_psl.R. The pin format changed; this workflow needs updating."
            exit 1
          fi

          # Latest commit that touched the list file itself, not the repo HEAD:
          # upstream carries tooling and test commits that leave the list alone.
          upstream="$(gh api \
            'repos/publicsuffix/list/commits?path=public_suffix_list.dat&per_page=1' \
            --jq '.[0].sha')"
          if ! printf '%s' "$upstream" | grep -qxE '[0-9a-f]{40}'; then
            echo "::error::Upstream lookup did not return a 40-character SHA (got '$upstream')."
            exit 1
          fi

          echo "pinned in tree : $pinned"
          echo "upstream latest: $upstream"

          if [ "$pinned" = "$upstream" ]; then
            echo "Bundled snapshot is current. No PR needed."
            echo "stale=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch="chore/psl-snapshot-$(printf '%s' "$upstream" | cut -c1-12)"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Branch '$branch' already exists; a PR for this upstream commit was opened already."
            echo "stale=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Upstream has moved. Regenerating."
          {
            echo "stale=true"
            echo "pinned=$pinned"
            echo "upstream=$upstream"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        if: steps.compare.outputs.stale == 'true'
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.compare.outputs.stale == 'true'
        with:
          # update_psl.R calls pkgload::load_all() to reuse the in-tree parser
          # and duplicate policy, then jsonlite for the commit date and digest
          # for the checksum.
          extra-packages: any::pkgload, any::jsonlite, any::digest

      - name: Record the outgoing snapshot
        if: steps.compare.outputs.stale == 'true'
        run: Rscript data-raw/psl_snapshot_meta.R > "${RUNNER_TEMP}/before.env"

      - name: Regenerate the bundled snapshot
        if: steps.compare.outputs.stale == 'true'
        run: Rscript data-raw/update_psl.R "${{ steps.compare.outputs.upstream }}"

      - name: Advance the pin and record the incoming snapshot
        if: steps.compare.outputs.stale == 'true'
        env:
          UPSTREAM: ${{ steps.compare.outputs.upstream }}
        run: |
          set -euo pipefail
          sed -i -E "s/^default_commit <- \"[0-9a-f]{40}\"/default_commit <- \"${UPSTREAM}\"/" data-raw/update_psl.R
          # Leaving the pin behind would ship artifacts that disagree with the
          # script that claims to generate them, so treat a failed edit as fatal.
          if ! grep -qxF "default_commit <- \"${UPSTREAM}\"" data-raw/update_psl.R; then
            echo "::error file=data-raw/update_psl.R::Failed to advance 'default_commit' to ${UPSTREAM}."
            exit 1
          fi
          Rscript data-raw/psl_snapshot_meta.R > "${RUNNER_TEMP}/after.env"

      - name: Open a review PR
        if: steps.compare.outputs.stale == 'true'
        env:
          PINNED: ${{ steps.compare.outputs.pinned }}
          UPSTREAM: ${{ steps.compare.outputs.upstream }}
          BRANCH: ${{ steps.compare.outputs.branch }}
        run: |
          set -euo pipefail

          # Fold the two KEY=VALUE snapshots into old_* / new_* shell variables.
          while IFS='=' read -r key value; do
            [ -n "$key" ] || continue
            printf -v "old_${key}" '%s' "$value"
          done < "${RUNNER_TEMP}/before.env"
          while IFS='=' read -r key value; do
            [ -n "$key" ] || continue
            printf -v "new_${key}" '%s' "$value"
          done < "${RUNNER_TEMP}/after.env"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add \
            inst/extdata/public_suffix_list.dat \
            inst/extdata/PSL-LICENSE \
            inst/NOTICE \
            R/sysdata.rda \
            tests/testthat/fixtures/psl-vectors.txt \
            data-raw/update_psl.R

          if git diff --cached --quiet; then
            echo "::warning::Upstream SHA moved but regeneration produced no file changes. Nothing to review."
            exit 0
          fi

          git commit -m "chore: refresh bundled PSL snapshot to ${UPSTREAM}

          Regenerated by .github/workflows/psl-upstream-check.yaml via
          data-raw/update_psl.R. Review the upstream diff before merging;
          NEWS.md and the package version are deliberately untouched."
          git push origin "$BRANCH"

          cat > "${RUNNER_TEMP}/pr-body.md" <<EOF
          Automated **discovery** PR: upstream \`publicsuffix/list\` has a newer commit
          to \`public_suffix_list.dat\` than the snapshot pinned in this repo.
          Regenerated by \`.github/workflows/psl-upstream-check.yaml\`, which shells out
          to \`data-raw/update_psl.R\` -- the same script a maintainer runs by hand.

          This PR is for review. Nothing was auto-merged, and \`NEWS.md\` and the package
          version are deliberately untouched: a bundled-data change alters query results
          and is release-shaped, so per \`CONTRIBUTING.md\` those stay maintainer calls.

          ## Snapshot

          | | Before | After |
          |---|---|---|
          | Upstream commit | \`${PINNED}\` | \`${UPSTREAM}\` |
          | \`list_date\` | ${old_list_date} | ${new_list_date} |
          | \`checksum\` | \`${old_checksum}\` | \`${new_checksum}\` |
          | Size (bytes) | ${old_size} | ${new_size} |
          | Rules | ${old_rules} | ${new_rules} |
          | ICANN / private | ${old_icann} / ${old_private} | ${new_icann} / ${new_private} |
          | Normalization | ${old_profile} / Unicode ${old_unicode_version} | ${new_profile} / Unicode ${new_unicode_version} |
          | Normalizer | ${old_normalizer} ${old_normalizer_version} | ${new_normalizer} ${new_normalizer_version} |

          Upstream diff: <https://github.com/publicsuffix/list/compare/${PINNED}...${UPSTREAM}>

          ## Before merging

          1. **Review the upstream diff** -- \`git diff inst/extdata/public_suffix_list.dat\`.
             A rule that moves the registrable-domain boundary is a behaviour change.
          2. **Check \`normalizer_version\` above.** It records whatever the runner
             resolved. While the temporary \`punycoder\` \`Remotes:\` pin is in place this
             will be a development version, which must not ship to CRAN (PSLR-fjkaqckg).
          3. **Add the \`NEWS.md\` entry** recording the new \`list_date\`, \`commit\`, and
             \`checksum\`, and decide the version bump.
          4. The full check matrix runs on this PR; the CC0 conformance vectors in
             \`tests/testthat/fixtures/psl-vectors.txt\` are re-pinned in lockstep and
             must stay green.

          See \`CONTRIBUTING.md\` > Release process > Bundled PSL snapshot.
          EOF

          gh pr create \
            --title "chore: refresh bundled PSL snapshot to $(printf '%s' "$UPSTREAM" | cut -c1-12)" \
            --body-file "${RUNNER_TEMP}/pr-body.md" \
            --base main \
            --head "$BRANCH"
