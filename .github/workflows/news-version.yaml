# Lightweight guard against NEWS/DESCRIPTION version drift.
# The top NEWS.md heading must be either "(development version)" or exactly
# match the DESCRIPTION Version, catching a stale heading left in at release.
# Every released version (one "v*" tag each) must also keep its own heading,
# catching a release section deleted or renamed after the fact.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: news-version.yaml

permissions: read-all

jobs:
  news-version:
    runs-on: ubuntu-latest
    name: NEWS/version consistency
    steps:
      - uses: actions/checkout@v7
        with:
          # The released-heading check reads "v*" tags, which a default
          # shallow checkout does not fetch.
          fetch-tags: true

      - name: Check top NEWS heading matches DESCRIPTION version
        run: |
          set -euo pipefail
          version="$(grep -E '^Version:' DESCRIPTION | head -n1 | sed -E 's/^Version:[[:space:]]*//')"
          # First top-level NEWS heading, e.g. "# pslr 1.0.0" or
          # "# pslr (development version)". Strip the name prefix.
          heading="$(grep -m1 -E '^# ' NEWS.md | sed -E 's/^#[[:space:]]+pslr[[:space:]]*//')"
          echo "DESCRIPTION Version : '$version'"
          echo "Top NEWS heading    : '$heading'"
          if [ "$heading" = "(development version)" ] || [ "$heading" = "$version" ]; then
            echo "OK: NEWS heading and version are consistent."
          else
            echo "::error::Top NEWS.md heading ('$heading') is neither '(development version)' nor the DESCRIPTION Version ('$version'). Update NEWS.md before release."
            exit 1
          fi

      - name: Check every released version still has a NEWS heading
        run: |
          set -euo pipefail
          tags="$(git tag -l 'v*')"
          if [ -z "$tags" ]; then
            echo "::error::No 'v*' tags found. The checkout step must fetch tags for this check to mean anything."
            exit 1
          fi
          missing=0
          for tag in $tags; do
            released="${tag#v}"
            # -x -F: whole line, literal, so the dots in a version are not
            # treated as regex wildcards.
            if grep -qxF "# pslr ${released}" NEWS.md; then
              echo "OK: '# pslr ${released}' present for tag ${tag}."
            else
              echo "::error::Tag ${tag} has no matching '# pslr ${released}' heading in NEWS.md. A released section was deleted or renamed; its bullets now read as unreleased work."
              missing=1
            fi
          done
          exit "$missing"
