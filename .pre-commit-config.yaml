# The hygiene hooks, at commit and at push. Install with `pre-commit install`
# (both hook types, from default_install_hook_types below), then
# `.fleet-ci/pre-push --install`, which replaces pre-commit's pre-push hook
# with fleet-ci's: that hook runs the fleet-ci local gate (.fleet-ci/gate,
# settings in .fleet-ci.yml) on each pushed ref, then this file's pre-push
# stage. The gate itself (docs drift, lintr, spelling, README drift, the URL
# check, the NEWS/tag check, R CMD check and the locale assertion) is in
# .fleet-ci.yml, never here: this file must not run .fleet-ci/gate (fleet-ci
# README, "The local gate").
#
# Over fleet-ci's hook, `pre-commit install` and
# `pre-commit install --hook-type pre-push` without -f move it to
# hooks/pre-push.legacy (pre-commit's migration mode), which still runs the
# gate first. `pre-commit install -f` (both types, from
# default_install_hook_types) and `pre-commit install -f --hook-type pre-push`
# delete it and drop the gate; `-f --hook-type pre-commit` leaves it alone.
# Re-run `.fleet-ci/pre-push --install` after either of the two.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=5120']
      # Bundled upstream PSL files under inst/extdata/ (the .dat whose sha256 is
      # recorded, and the verbatim MPL-2.0 LICENSE) must stay byte-for-byte
      # identical to upstream, so the whitespace/EOF fixers must not touch them.
      # .fleet-ci/ is fleet-ci's bin/vendor output, which seor's fleet checker
      # requires byte for byte; re-run bin/vendor rather than editing it.
      - id: end-of-file-fixer
        exclude: &fixer-excludes '^(inst/extdata/|\.fleet-ci/)'
      - id: trailing-whitespace
        exclude: *fixer-excludes
      - id: check-merge-conflict
      # Every YAML file but .gitlab-ci.yml through PyYAML's safe loader.
      - id: check-yaml
        exclude: ^\.gitlab-ci\.yml$
      # .gitlab-ci.yml with --unsafe: syntax only. Its x-* jobs use GitLab's
      # `!reference` tag, which the safe loader cannot construct. GitLab's CI
      # lint API and fleet-ci's bin/rules-sim read that file in full.
      - id: check-yaml
        name: check yaml (.gitlab-ci.yml, syntax only)
        args: [--unsafe]
        files: ^\.gitlab-ci\.yml$
      # `air.toml` configures the formatter that rewrites every R source in the
      # repo, so a malformed one is worth catching at the commit rather than at
      # the next `air format` run.
      - id: check-toml
      - id: mixed-line-ending
        exclude: *fixer-excludes
      - id: check-case-conflict
  # Air: fast, R-free (Rust binary) formatter for R sources. Runs per commit and
  # auto-fixes; layout is Air's job, while lintr (in the fleet-ci gate) owns
  # logic/best-practice lints. https://posit-dev.github.io/air/
  # .fleet-ci/gate-run.R is vendored byte for byte, so Air leaves it alone.
  - repo: https://github.com/posit-dev/air-pre-commit
    rev: 0.12.0
    hooks:
      - id: air-format
        exclude: '^\.fleet-ci/'
  # British spellings in code, comments, string literals and tooling, which
  # spelling::spell_check_package() (the fleet-ci gate) never reads: it covers
  # DESCRIPTION, roxygen, vignettes, README and NEWS only, and that gap let
  # British runtime messages ship (SEOR-xtmnpmae). Only the en-GB_to_en-US
  # dictionary is enabled, so this is not a general typo checker. codespell
  # skips dotfiles unless given --check-hidden, so .bestpractices.json is
  # skipped either way; it is listed so the intent survives a flag change.
  # Excluded: man/ (roxygen output; fix the roxygen source), upstream PSL data
  # in inst/extdata/, test fixtures, the tracker snapshot (recorded text,
  # regenerated wholesale), .bestpractices.json (mirrors the live
  # bestpractices.dev entry) and .fleet-ci/ (fleet-ci's bin/vendor output).
  # docs/ is hand-written source here and is checked.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: codespell (British spellings, en-GB_to_en-US; SEOR-xtmnpmae)
        args: [--builtin, en-GB_to_en-US]
        stages: [pre-commit, pre-push]
        exclude: '^(\.fleet-ci/|man/|inst/extdata/|tests/testthat/fixtures/|docs/tracker-snapshot\.md$|\.bestpractices\.json$)'
  - repo: local
    hooks:
      # Refuses the push when this clone's pre-push hook is not fleet-ci's,
      # so the push would run without the gate (SEOR-gksaxuoz). It only
      # reads the hook file; it never runs .fleet-ci/gate.
      - id: fleet-ci-hook-installed
        name: fleet-ci pre-push hook is installed
        entry: sh scripts/check-fleet-hook.sh
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-push]
      # This machine's R toolchain against what the package pins: roxygen2
      # against Config/roxygen2/version, installed packages built under a newer
      # R, and the local pandoc against the fleet image's (.fleet-ci/toolchain),
      # so a local devtools::document() or build_readme() writes what the gate
      # accepts. The gate itself runs in the fleet image and does not depend
      # on this machine's library. Quick: one request, for CRAN's package
      # index (SEOR-hxxxkmws, SEOR-tcytizic).
      - id: check-toolchain
        name: toolchain matches what this package pins
        entry: Rscript scripts/check-toolchain.R
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # CITATION.cff and .zenodo.json duplicate the version and the project
      # URLs out of DESCRIPTION, and nothing asserted either copy. Offline,
      # stdlib-only and instant. The rule it enforces is
      # https://gitlab.com/bart-turczynski/seor's
      # design/adr/0001-citation-metadata-names-the-release.md.
      - id: check-citation
        name: citation metadata vs DESCRIPTION
        entry: python3 scripts/check-citation.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # The self-tests the former citation-version CI job ran on every push
      # to main, now when the script changes, like news-terse-self-test.
      - id: check-citation-self-test
        name: check-citation self-test
        entry: python3 scripts/check-citation.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/check-citation\.py$
        stages: [pre-push]
      # Every tracker link -- DESCRIPTION's BugReports:, codemeta.json,
      # .bestpractices.json, the GitHub PR template -- names /-/work_items, and
      # no human-facing surface may carry a /-/issues link, which 404s for
      # CRAN's URL check; CRAN accepts /-/work_items (PSLR-cvhksjst, replacing
      # the split of SEOR-ocbtrrnl). Ported from pagerankr's
      # scripts/check-bugreports.py, whose v1 rule it now reverses (v2);
      # stdlib-only and offline, wired exactly
      # like check-citation above. The script's docstring has the history.
      - id: check-bugreports
        name: BugReports and tracker links name /-/work_items
        entry: python3 scripts/check-bugreports.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: check-bugreports-self-test
        name: check-bugreports self-test
        entry: python3 scripts/check-bugreports.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/check-bugreports\.py$
        stages: [pre-push]
      # check-news.py refuses a NEWS.md bullet that wraps, runs past its word
      # limit or names only housekeeping, and any Internal heading
      # (https://gitlab.com/bart-turczynski/seor's design/fleet-standard.md,
      # "NEWS.md bullets"; SEOR-skfshchx). Ported from seor unmodified;
      # stdlib-only and offline, wired like check-citation above. Its
      # self-test runs only when the script changes.
      - id: news-terse
        name: NEWS.md bullets are one terse line
        entry: python3 scripts/check-news.py NEWS.md
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: news-terse-self-test
        name: check-news self-test
        entry: python3 scripts/check-news.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/check-news\.py$
        stages: [pre-push]
      # bestpractices-url.py is a maintainer tool that reads the network, so the
      # hook runs only its offline self-test, and only when the script changes.
      - id: bestpractices-url-self-test
        name: bestpractices-url self-test
        entry: python3 scripts/bestpractices-url.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/bestpractices-url\.py$
        stages: [pre-push]
