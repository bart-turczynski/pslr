# Overrides the shared config: the shared `verify` hook wraps the command in a
# bash invocation that breaks on R's verify command (it contains the double
# quotes from the rcmdcheck --as-cran argument). The gate now lives in
# tools/verify.sh, so there is no R source in this file to quote at all.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=5120']
      # Bundled upstream PSL files under inst/extdata/ (the .dat whose sha256 is
      # recorded, and the verbatim MPL-2.0 LICENSE) must stay byte-for-byte
      # identical to upstream, so the whitespace/EOF fixers must not touch them.
      - id: end-of-file-fixer
        exclude: '^inst/extdata/'
      - id: trailing-whitespace
        exclude: '^inst/extdata/'
      - id: check-merge-conflict
      - id: check-yaml
      # `air.toml` configures the formatter that rewrites every R source in the
      # repo, so a malformed one is worth catching at the commit rather than at
      # the next `air format` run.
      - id: check-toml
      - id: mixed-line-ending
        exclude: '^inst/extdata/'
      - id: check-case-conflict
  # Air: fast, R-free (Rust binary) formatter for R sources. Runs per commit and
  # auto-fixes; layout is Air's job, while lintr (in the verify gate) owns
  # logic/best-practice lints. https://posit-dev.github.io/air/
  - repo: https://github.com/posit-dev/air-pre-commit
    rev: 0.8.2
    hooks:
      - id: air-format
  # British spellings in code, comments, string literals and tooling, which
  # spelling::spell_check_package() (verify gate) never reads: it covers
  # DESCRIPTION, roxygen, vignettes, README and NEWS only, and that gap let
  # British runtime messages ship (SEOR-xtmnpmae). Only the en-GB_to_en-US
  # dictionary is enabled, so this is not a general typo checker. codespell
  # skips dotfiles unless given --check-hidden, so .bestpractices.json is
  # skipped either way; it is listed so the intent survives a flag change.
  # Excluded: man/ (roxygen output; fix the roxygen source), upstream PSL data
  # in inst/extdata/, test fixtures, the tracker snapshot (recorded text,
  # regenerated wholesale) and .bestpractices.json (mirrors the live
  # bestpractices.dev entry). docs/ is hand-written source here and is checked.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: codespell (British spellings, en-GB_to_en-US; SEOR-xtmnpmae)
        args: [--builtin, en-GB_to_en-US]
        stages: [pre-commit, pre-push]
        exclude: '^(man/|inst/extdata/|tests/testthat/fixtures/|docs/tracker-snapshot\.md$|\.bestpractices\.json$)'
  - repo: local
    hooks:
      # The hosted pipeline no longer runs per push (see the `workflow:` rules
      # in .gitlab-ci.yml), so this hook is not a mirror of CI any more — it is
      # the gate. It runs the `standard` tier and then prints how long it has
      # been since a `full` run. That staleness line is a nudge, never a block:
      # a hook that refused a push until a 15-minute check had run would be
      # bypassed with --no-verify within a fortnight, and then nothing would run
      # at all. That applies to the tier itself too: `standard` is lint plus the
      # test suite, not `R CMD check --as-cran`, because the check version took
      # ~5 minutes and got skipped on its very first real push.
      # Toolchain drift makes the gate red on a tree nobody changed, and it
      # arrives disguised as a code defect: a roxygen2 skew aborts the docs
      # guard, and a package built under a newer R than this one surfaces as an
      # R CMD check WARNING minutes into the expensive step below. This is
      # quick (one request, for CRAN's package index, which the check for a
      # dependency older than CRAN's reads: SEOR-hxxxkmws), and it runs ahead
      # of that step so the machine is
      # named as the cause in one line rather than found by elimination
      # (SEOR-tcytizic).
      - id: check-toolchain
        name: toolchain matches what this package pins
        entry: Rscript scripts/check-toolchain.R
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: verify
        name: verify (standard tier + staleness nudge)
        entry: tools/verify.sh
        args: [standard]
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        verbose: true
      # CITATION.cff and .zenodo.json duplicate the version and the project
      # URLs out of DESCRIPTION, and nothing asserted either copy. Offline,
      # stdlib-only and instant. The rule it enforces is
      # https://gitlab.com/bart-turczynski/seor's
      # design/adr/0001-citation-metadata-names-the-release.md.
      - id: check-citation
        name: citation metadata vs DESCRIPTION
        entry: python3 scripts/check-citation.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # DESCRIPTION's BugReports: keeps the /-/issues form CRAN's incoming
      # check string-tests for (the first 1.2.1 upload was archived for
      # declaring /-/work_items there); every human-facing tracker link
      # (codemeta.json, .bestpractices.json, the GitHub PR template) names
      # /-/work_items, and no other human-facing surface may carry a /-/issues
      # link (SEOR-ocbtrrnl, PSLR-kjkmhrok). Ported from pagerankr's
      # scripts/check-bugreports.py; stdlib-only and offline, wired exactly
      # like check-citation above. The script's docstring says why the two
      # forms must differ.
      - id: check-bugreports
        name: BugReports split (DESCRIPTION vs human-facing tracker links)
        entry: python3 scripts/check-bugreports.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # bestpractices-url.py is a maintainer tool that reads the network, so the
      # hook runs only its offline self-test, and only when the script changes.
      - id: bestpractices-url-self-test
        name: bestpractices-url self-test
        entry: python3 scripts/bestpractices-url.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/bestpractices-url\.py$
        stages: [pre-push]
      # The verify hook's test stage must fail when a test fails or errors, or
      # when no test ran, and it checks testthat's results itself rather than
      # trusting stop_on_failure alone. A full-disk run was reported to pass
      # with `[ FAIL 7 ]` on screen; that did not reproduce (PSLR-vacblucj),
      # and the result check makes it impossible whatever the cause. Every
      # push, not only one that touches the gate: a testthat upgrade can change
      # what stop_on_failure does without changing a file here. Offline, about
      # seven seconds on throwaway packages.
      - id: verify-self-test
        name: verify gate self-test (the test stage fails closed)
        entry: scripts/verify-self-test.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
